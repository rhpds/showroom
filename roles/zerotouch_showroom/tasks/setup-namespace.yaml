---
# Try a plain Namespace first (works when the deploying service account has
# direct namespace-create permissions). Fall back to ProjectRequest, which
# takes advantage of self-provisioner if present.
# ProjectRequest fails until the namespace is created, then fails because
# `AlreadyExists`. Though this is an error, it's the condition we hope to
# achieve. These are the limitations of the ProjectRequest and self-provisioner

- name: Get showroom namespace
  kubernetes.core.k8s_info:
    kubeconfig: "{{ _showroom_kubeconfig | default(omit) }}"
    host: "{{ ocp4_workload_showroom_openshift_api_url | default(omit) }}"
    api_key: "{{ ocp4_workload_showroom_openshift_api_token | default(omit) }}"
    validate_certs: false
    api_version: project.openshift.io/v1
    kind: Project
    name: "{{ _showroom_namespace }}"
  register: r_get_showroom_namespace
  failed_when: false

- name: Create showroom namespace
  when: r_get_showroom_namespace.resources | default([]) | length == 0
  kubernetes.core.k8s:
    kubeconfig: "{{ _showroom_kubeconfig | default(omit) }}"
    host: "{{ ocp4_workload_showroom_openshift_api_url | default(omit) }}"
    api_key: "{{ ocp4_workload_showroom_openshift_api_token | default(omit) }}"
    validate_certs: false
    definition:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{ _showroom_namespace }}"
        labels:
          guid: "{{ guid }}"
          creator: agnosticd.showroom.zerotouch_showroom
  register: r_create_showroom_namespace
  ignore_errors: true
  retries: 10
  delay: 5
  until: r_create_showroom_namespace is not failed

# For shared clusters where the service account does not have permission
# to create namespaces directly.
- name: Attempt to create showroom project if namespace creation failed
  when:
  - r_get_showroom_namespace.resources | default([]) | length == 0
  - r_create_showroom_namespace is failed
  kubernetes.core.k8s:
    kubeconfig: "{{ _showroom_kubeconfig | default(omit) }}"
    host: "{{ ocp4_workload_showroom_openshift_api_url | default(omit) }}"
    api_key: "{{ ocp4_workload_showroom_openshift_api_token | default(omit) }}"
    validate_certs: false
    definition:
      apiVersion: project.openshift.io/v1
      kind: ProjectRequest
      metadata:
        name: "{{ _showroom_namespace }}"
        labels:
          guid: "{{ guid }}"
          creator: agnosticd.showroom.zerotouch_showroom
  register: r_create_showroom_project
  # Work around https://github.com/ansible-collections/kubernetes.core/issues/623
  failed_when: >-
    r_create_showroom_project is failed and
    'AlreadyExists' not in r_create_showroom_project.msg | default('')
  until: r_create_showroom_project is successful
  retries: 10
  delay: 5

- name: Test the self-provisioner
  when: ocp4_workload_showroom_test_self_provisioner | default(false) | bool
  block:

  - name: Create a test object in the showroom namespace to validate self-provisioner with retries
    kubernetes.core.k8s:
      kubeconfig: "{{ _showroom_kubeconfig | default(omit) }}"
      host: "{{ ocp4_workload_showroom_openshift_api_url | default(omit) }}"
      api_key: "{{ ocp4_workload_showroom_openshift_api_token | default(omit) }}"
      validate_certs: false
      state: present
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: test
          namespace: "{{ _showroom_namespace }}"
    register: r_create_test_object
    until: r_create_test_object is successful
    retries: 5
    delay: 10

  - name: Remove test object
    kubernetes.core.k8s:
      kubeconfig: "{{ _showroom_kubeconfig | default(omit) }}"
      host: "{{ ocp4_workload_showroom_openshift_api_url | default(omit) }}"
      api_key: "{{ ocp4_workload_showroom_openshift_api_token | default(omit) }}"
      validate_certs: false
      state: absent
      definition:
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: test
          namespace: "{{ _showroom_namespace }}"
