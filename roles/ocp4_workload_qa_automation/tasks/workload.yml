---
# =============================================================================
# ocp4_workload_qa_automation
#
# Creates a qa-automation ServiceAccount in the showroom namespace and
# generates a kubeconfig Secret (qa-automation-kubeconfig / key "kubeconfig")
# consumed by zerotouch-automation as the Ansible extravar k8s_kubeconfig.
#
# Tenant mode (cluster_admin: false, default):
#   SA gets an "admin" RoleBinding in each student namespace only.
# Dedicated mode (cluster_admin: true):
#   SA gets a cluster-admin ClusterRoleBinding.
# =============================================================================

- name: Build student namespace list
  ansible.builtin.include_tasks: build_namespace_list.yml

- name: Fail fast if tenant mode has no student namespaces configured
  when:
    - not (ocp4_workload_qa_automation_cluster_admin | bool)
    - _qa_automation_namespaces | length == 0
  ansible.builtin.fail:
    msg: >-
      ocp4_workload_qa_automation_cluster_admin is false but no
      student namespace suffixes were provided — the
      {{ ocp4_workload_qa_automation_sa_name }} SA would get no RBAC
      anywhere. Set ocp4_workload_tenant_namespace_suffixes or
      ocp4_workload_qa_automation_cluster_admin: true.

- name: Create qa-automation ServiceAccount in showroom namespace
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_qa_automation_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_qa_automation_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ ocp4_workload_qa_automation_sa_name }}"
        namespace: "{{ ocp4_workload_qa_automation_showroom_namespace }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_qa_automation
          guid: "{{ guid }}"
      automountServiceAccountToken: false
  register: r_qa_automation_sa
  until: r_qa_automation_sa is succeeded
  retries: "{{ ocp4_workload_qa_automation_retries }}"
  delay: "{{ ocp4_workload_qa_automation_retry_delay }}"

- name: Create long-lived token Secret for qa-automation ServiceAccount
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_qa_automation_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_qa_automation_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp4_workload_qa_automation_token_secret_name }}"
        namespace: "{{ ocp4_workload_qa_automation_showroom_namespace }}"
        annotations:
          kubernetes.io/service-account.name: "{{ ocp4_workload_qa_automation_sa_name }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_qa_automation
          guid: "{{ guid }}"
      type: kubernetes.io/service-account-token
  register: r_qa_automation_token_secret
  until: r_qa_automation_token_secret is succeeded
  retries: "{{ ocp4_workload_qa_automation_retries }}"
  delay: "{{ ocp4_workload_qa_automation_retry_delay }}"

- name: Wait for token Secret to be populated with token and CA data
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_qa_automation_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_qa_automation_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    api_version: v1
    kind: Secret
    name: "{{ ocp4_workload_qa_automation_token_secret_name }}"
    namespace: "{{ ocp4_workload_qa_automation_showroom_namespace }}"
  register: r_qa_automation_token
  retries: "{{ ocp4_workload_qa_automation_token_wait_retries }}"
  delay: "{{ ocp4_workload_qa_automation_token_wait_delay }}"
  until: >-
    r_qa_automation_token.resources | length > 0
    and (r_qa_automation_token.resources[0].data.token | default('')) | length > 0
    and (r_qa_automation_token.resources[0].data['ca.crt'] | default('')) | length > 0

- name: Grant qa-automation ServiceAccount admin in each student namespace
  when: not (ocp4_workload_qa_automation_cluster_admin | bool)
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_qa_automation_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_qa_automation_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: "{{ ocp4_workload_qa_automation_sa_name }}-{{ guid }}"
        namespace: "{{ item }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_qa_automation
          guid: "{{ guid }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ ocp4_workload_qa_automation_sa_name }}"
          namespace: "{{ ocp4_workload_qa_automation_showroom_namespace }}"
      roleRef:
        kind: ClusterRole
        name: "{{ ocp4_workload_qa_automation_namespace_role }}"
        apiGroup: rbac.authorization.k8s.io
  loop: "{{ _qa_automation_namespaces }}"
  register: r_qa_automation_rolebinding
  until: r_qa_automation_rolebinding is succeeded
  retries: "{{ ocp4_workload_qa_automation_retries }}"
  delay: "{{ ocp4_workload_qa_automation_retry_delay }}"

- name: Grant qa-automation ServiceAccount cluster-admin (dedicated mode)
  when: ocp4_workload_qa_automation_cluster_admin | bool
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_qa_automation_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_qa_automation_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "{{ ocp4_workload_qa_automation_sa_name }}-{{ guid }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_qa_automation
          guid: "{{ guid }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ ocp4_workload_qa_automation_sa_name }}"
          namespace: "{{ ocp4_workload_qa_automation_showroom_namespace }}"
      roleRef:
        kind: ClusterRole
        name: "{{ ocp4_workload_qa_automation_cluster_role }}"
        apiGroup: rbac.authorization.k8s.io
  register: r_qa_automation_clusterrolebinding
  until: r_qa_automation_clusterrolebinding is succeeded
  retries: "{{ ocp4_workload_qa_automation_retries }}"
  delay: "{{ ocp4_workload_qa_automation_retry_delay }}"

- name: Store kubeconfig Secret in showroom namespace
  vars:
    _qa_automation_token: "{{ r_qa_automation_token.resources[0].data.token | b64decode }}"
    _qa_automation_ca_crt_b64: "{{ r_qa_automation_token.resources[0].data['ca.crt'] }}"
    _qa_automation_api_server: >-
      {{ ocp4_workload_qa_automation_openshift_api_url
         | default('https://kubernetes.default.svc', true) }}
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_qa_automation_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_qa_automation_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp4_workload_qa_automation_secret_name }}"
        namespace: "{{ ocp4_workload_qa_automation_showroom_namespace }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_qa_automation
          guid: "{{ guid }}"
          mode: "{{ 'cluster-admin' if ocp4_workload_qa_automation_cluster_admin | bool else 'namespace-admin' }}"
      stringData:
        kubeconfig: "{{ lookup('template', 'kubeconfig.yml.j2') }}"
  register: r_qa_automation_kubeconfig_secret
  until: r_qa_automation_kubeconfig_secret is succeeded
  retries: "{{ ocp4_workload_qa_automation_retries }}"
  delay: "{{ ocp4_workload_qa_automation_retry_delay }}"

- name: Workload tasks complete
  when: not (silent | default(false) | bool)
  ansible.builtin.debug:
    msg: "ocp4_workload_qa_automation tasks completed successfully."
