---
# Builds _qa_automation_namespaces: the list of student namespace names
# ("{{ username }}-{{ suffix }}") used in tenant mode. Shared by
# workload.yml and remove_workload.yml so provisioning and teardown always
# compute the exact same namespace list.

- name: Initialize student namespace list
  ansible.builtin.set_fact:
    _qa_automation_namespaces: []

- name: Build student namespace list
  ansible.builtin.set_fact:
    _qa_automation_namespaces: "{{ _qa_automation_namespaces + [ocp4_workload_qa_automation_username + '-' + item.suffix] }}"
  loop: "{{ ocp4_workload_qa_automation_namespace_suffixes }}"
  loop_control:
    label: "{{ item.suffix }}"
