---
# =============================================================================
# ocp4_workload_runtime_automation_k8s
#
# Creates a zt-runner ServiceAccount in the showroom namespace and generates
# a kubeconfig Secret (zt-runner-kubeconfig / key "kubeconfig") consumed by
# zerotouch-automation as the Ansible extravar k8s_kubeconfig.
#
# Tenant mode (cluster_admin: false, default):
#   SA gets an "admin" RoleBinding in each student namespace only.
# Dedicated mode (cluster_admin: true):
#   SA gets a cluster-admin ClusterRoleBinding.
# =============================================================================

- name: Build student namespace list
  ansible.builtin.set_fact:
    _rak8s_namespaces: >-
      {{ ocp4_workload_runtime_automation_k8s_namespace_suffixes
         | map(attribute='suffix')
         | map('regex_replace', '^(.+)$',
               ocp4_workload_runtime_automation_k8s_username + '-\1')
         | list }}

- name: Create zt-runner ServiceAccount in showroom namespace
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: "{{ ocp4_workload_runtime_automation_k8s_sa_name }}"
        namespace: "{{ ocp4_workload_runtime_automation_k8s_showroom_namespace }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_runtime_automation_k8s
          guid: "{{ guid }}"
      automountServiceAccountToken: false

- name: Create long-lived token Secret for zt-runner ServiceAccount
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp4_workload_runtime_automation_k8s_token_secret_name }}"
        namespace: "{{ ocp4_workload_runtime_automation_k8s_showroom_namespace }}"
        annotations:
          kubernetes.io/service-account.name: "{{ ocp4_workload_runtime_automation_k8s_sa_name }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_runtime_automation_k8s
          guid: "{{ guid }}"
      type: kubernetes.io/service-account-token

- name: Wait for token Secret to be populated with token and CA data
  kubernetes.core.k8s_info:
    host: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    api_version: v1
    kind: Secret
    name: "{{ ocp4_workload_runtime_automation_k8s_token_secret_name }}"
    namespace: "{{ ocp4_workload_runtime_automation_k8s_showroom_namespace }}"
  register: r_rak8s_token
  retries: 12
  delay: 5
  until: >-
    r_rak8s_token.resources | length > 0
    and (r_rak8s_token.resources[0].data.token | default('')) | length > 0
    and (r_rak8s_token.resources[0].data['ca.crt'] | default('')) | length > 0

- name: Set kubeconfig token, CA and API server facts
  ansible.builtin.set_fact:
    _rak8s_token: "{{ r_rak8s_token.resources[0].data.token | b64decode }}"
    _rak8s_ca_crt_b64: "{{ r_rak8s_token.resources[0].data['ca.crt'] }}"
    _rak8s_api_server: >-
      {{ ocp4_workload_runtime_automation_k8s_openshift_api_url
         | default('https://kubernetes.default.svc', true) }}

- name: Grant zt-runner ServiceAccount admin in each student namespace
  when: not (ocp4_workload_runtime_automation_k8s_cluster_admin | bool)
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: zt-runner
        namespace: "{{ item }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_runtime_automation_k8s
          guid: "{{ guid }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ ocp4_workload_runtime_automation_k8s_sa_name }}"
          namespace: "{{ ocp4_workload_runtime_automation_k8s_showroom_namespace }}"
      roleRef:
        kind: ClusterRole
        name: admin
        apiGroup: rbac.authorization.k8s.io
  loop: "{{ _rak8s_namespaces }}"

- name: Grant zt-runner ServiceAccount cluster-admin (dedicated mode)
  when: ocp4_workload_runtime_automation_k8s_cluster_admin | bool
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: rbac.authorization.k8s.io/v1
      kind: ClusterRoleBinding
      metadata:
        name: "zt-runner-{{ guid }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_runtime_automation_k8s
          guid: "{{ guid }}"
      subjects:
        - kind: ServiceAccount
          name: "{{ ocp4_workload_runtime_automation_k8s_sa_name }}"
          namespace: "{{ ocp4_workload_runtime_automation_k8s_showroom_namespace }}"
      roleRef:
        kind: ClusterRole
        name: cluster-admin
        apiGroup: rbac.authorization.k8s.io

- name: Store kubeconfig Secret in showroom namespace
  kubernetes.core.k8s:
    host: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_url | default(omit, true) }}"
    api_key: "{{ ocp4_workload_runtime_automation_k8s_openshift_api_token | default(omit, true) }}"
    validate_certs: false
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{ ocp4_workload_runtime_automation_k8s_secret_name }}"
        namespace: "{{ ocp4_workload_runtime_automation_k8s_showroom_namespace }}"
        labels:
          created-by: agnosticd.showroom.ocp4_workload_runtime_automation_k8s
          guid: "{{ guid }}"
          mode: "{{ 'cluster-admin' if ocp4_workload_runtime_automation_k8s_cluster_admin | bool else 'namespace-admin' }}"
      stringData:
        kubeconfig: "{{ lookup('template', 'kubeconfig.yml.j2') }}"
