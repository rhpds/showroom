---

- name: Running workload provision tasks
  when: ACTION | default("provision") == "provision"
  block:

    - name: Deploy the showroom user interface
      when: showroom_deploy | default(true) | bool
      block:

        - name: Setup OS dependencies, packages
          ansible.builtin.include_tasks:
            file: 10-showroom-dependencies.yml
          tags:
            - showroom-dependency-setup

        - name: Setup the showroom user and working directories
          ansible.builtin.include_tasks:
            file: 20-showroom-user-setup.yml
          tags:
            - showroom-user-setup

        - name: Setup ssh config and other security measures for lab accounts
          ansible.builtin.include_tasks:
            file: 22-showroom-users-security.yml
          tags:
            - showroom-user-security

        - name: Clone primary showroom repo and inject externals (vars, html templates)
          ansible.builtin.include_tasks:
            file: 30-showroom-clone-and-inject.yml
          tags:
            - showroom-clone-and-inject

        - name: Render antora content
          ansible.builtin.include_tasks:
            file: 40-showroom-render.yml
          tags:
            - showroom-render

        - name: Create, enable, start showroom systemd service
          ansible.builtin.include_tasks:
            file: 50-showroom-service.yml
          tags:
            - showroom-services

        - name: Validate showroom service and output view url(s)
          ansible.builtin.include_tasks:
            file: 60-showroom-verify.yml
          tags:
            - showroom-verify

      # Default: re-raise so the provision fails as before.
      # showroom_ignore_deploy_errors: warn and let the provision continue.
      #
      # Tagged "always" on every task below: every task in the block above
      # carries its own stage tag (showroom-render, showroom-verify, etc.) for
      # selective `--tags` re-runs during development. Tag selection
      # supersedes block error handling in Ansible, so without "always" a
      # `--tags showroom-render`-style run whose selected task fails would
      # skip these rescue tasks entirely (untagged tasks are filtered out)
      # and the failure would be silently swallowed instead of re-raised.
      rescue:

        # ansible_failed_result.msg is frequently empty or generic for the
        # modules most likely to fail here (e.g. containers.podman.podman_container
        # when the user-supplied content breaks the Antora build) - the real
        # cause is more often in .stderr/.stdout. Fall through msg -> stderr
        # -> stdout -> a final placeholder so we don't surface "unknown
        # error" when better detail was available on the result.
        - name: Compute showroom deployment failure detail
          ansible.builtin.set_fact:
            f_showroom_deploy_failure_detail: >-
              {{ ansible_failed_result.msg
                 | default(ansible_failed_result.stderr, true)
                 | default(ansible_failed_result.stdout, true)
                 | default('unknown error', true) }}
          tags:
            - always

        - name: Print full result of the failed showroom deployment task
          ansible.builtin.debug:
            var: ansible_failed_result
          tags:
            - always

        - name: Fail showroom deployment
          when: not showroom_ignore_deploy_errors | bool
          ansible.builtin.fail:
            msg: >-
              Showroom deployment failed in task
              '{{ ansible_failed_task.name | default('unknown') }}':
              {{ f_showroom_deploy_failure_detail }}
          tags:
            - always

        - name: Report ignored showroom deployment failure
          when: showroom_ignore_deploy_errors | bool
          agnosticd.core.agnosticd_user_info:
            msg: >-
              WARNING: Showroom could not be deployed. Failed task
              '{{ ansible_failed_task.name | default('unknown') }}':
              {{ f_showroom_deploy_failure_detail }}
          tags:
            - always

- name: Running workload removal tasks
  when: ACTION | default("provision") == "destroy"
  ansible.builtin.debug:
    msg: >-
      vm_workload_showroom destroy is a no-op.
      The VM itself is being torn down.
