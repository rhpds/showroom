---
# roles/vm_workload_showroom/tasks/35-showroom-authguard-secrets.yml
- name: Generate an AUTH_TOKEN if one was not supplied
  when: not showroom_auth_token
  ansible.builtin.set_fact:
    showroom_auth_token: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"

- name: Generate a SESSION_SECRET if one was not supplied
  when: not showroom_auth_session_secret
  ansible.builtin.set_fact:
    showroom_auth_session_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"

- name: Publish the access token via agnosticd_user_info, when available
  when: showroom_auth_enable | bool
  agnosticd.core.agnosticd_user_info:
    data:
      showroom_access_token: "{{ showroom_auth_token }}"
    msg: "Showroom access token: {{ showroom_auth_token }}"
  failed_when: false
