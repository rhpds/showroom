---
# Connection to cluster to deploy to. Only set when deploying to a remote cluster.
# ocp4_workload_showroom_openshift_api_token: "{{ cluster_admin_agnosticd_sa_token }}"
# ocp4_workload_showroom_openshift_api_url: "{{ sandbox_openshift_api_url}}"

ocp4_workload_showroom_name: "showroom"
ocp4_workload_showroom_namespace: "showroom-{{ guid | default('00000') }}"

# Override container images (empty = use chart default for the pinned chart version)
ocp4_workload_showroom_content_image: ""
ocp4_workload_showroom_antora_image: ""
ocp4_workload_showroom_git_cloner_image: ""

# Content repository to be rendered as lab instructions
ocp4_workload_showroom_content_git_repo: https://github.com/rhpds/showroom-template.git
ocp4_workload_showroom_content_git_repo_ref: main

# Which Antora Playbook to use in the content repo
ocp4_workload_showroom_content_antora_playbook: site.yml

# Which terminal(s) to deploy:
# - ocp-terminal: deploy the ocp-terminal image (ttyd sandbox with oc CLI)
# - wetty: deploy the wetty terminal image (SSH to bastion).
#          Set ocp4_workload_showroom_wetty_ssh_bastion_login to true
#          to automatically ssh to a bastion.
# - both: deploy both ocp-terminal and wetty
# - showroom: (deprecated alias for ocp-terminal, kept for backward compatibility)
# - "": No terminal deployed
ocp4_workload_showroom_terminal_type: ocp-terminal

# Requests and limits for the terminal pod (same vars for either showroom or wetty)
ocp4_workload_showroom_terminal_requests_cpu: 50m
ocp4_workload_showroom_terminal_requests_memory: 256Mi
ocp4_workload_showroom_terminal_limits_cpu: 500m
ocp4_workload_showroom_terminal_limits_memory: 1Gi

# Persistent storage for the terminal lab-user home directory
ocp4_workload_showroom_terminal_storage_enable: true
ocp4_workload_showroom_terminal_storage_pvc_size: 5Gi
# Use default StorageClass when empty
ocp4_workload_showroom_terminal_storage_class: ""

# Override ui-config.yml for the content container (JSON or YAML string, empty = use repo default)
ocp4_workload_showroom_content_ui_config: ""

# Override the Antora UI bundle URL (empty = use the default from site.yml)
ocp4_workload_showroom_content_antora_ui_bundle_url: ""

# Override the navbar logo (e.g. "summit" for Red Hat Summit branding; empty = use default)
ocp4_workload_showroom_content_antora_navbar_logo: ""

# Master toggle: enable dev mode for all showroom containers (antora, and future content containers)
ocp4_workload_showroom_enable_dev_mode: false

# Enable Antora dev-mode extension (adds attribute pages and unlisted pages to nav).
# Also enabled when ocp4_workload_showroom_enable_dev_mode is true.
ocp4_workload_showroom_antora_enable_dev_mode: false

# Showroom Terminal Image. Options include:
# - quay.io/rhpds/openshift-showroom-terminal-ocp:latest
# - quay.io/rhpds/openshift-showroom-terminal-rosa:latest
# - quay.io/rhpds/openshift-showroom-terminal-aro:latest
ocp4_workload_showroom_terminal_image: quay.io/rhpds/openshift-showroom-terminal-ocp:4.20-2026-08-05

# Wetty Image
ocp4_workload_showroom_wetty_image: quay.io/rhpds/wetty:v3.2.1

# Log into bastion automatically from wetty
# applies to both primary and seconary wetty terminals
ocp4_workload_showroom_wetty_ssh_bastion_login: false

# Deploy a VNC client in a new tab
ocp4_workload_showroom_novnc_enable: false
ocp4_workload_showroom_novnc_vnc_server_hostport: 128.0.0.1:5900
ocp4_workload_showroom_novnc_image: ghcr.io/rhpds/showroom-novnc:latest
ocp4_workload_showroom_novnc_requests_cpu: 50m
ocp4_workload_showroom_novnc_requests_memory: 256Mi
ocp4_workload_showroom_novnc_limits_cpu: 550m
ocp4_workload_showroom_novnc_limits_memory: 256Mi

# The service name to look for when waiting for the created route
# Usually `showroom-proxy` for multi-pod deployment and `showroom` for single pod deployment
ocp4_workload_showroom_service_name: "{{ ocp4_workload_showroom_name }}"

# Helm Chart to use for Showroom. This needs to be a packaged chart in a registry.
# For the example below the source registry is https://github.com/rhpds/showroom-deployer
ocp4_workload_showroom_chart_package_url: https://rhpds.github.io/showroom-deployer
ocp4_workload_showroom_deployer_chart_name: showroom-single-pod

# Available versions are at https://github.com/rhpds/showroom-deployer/releases
ocp4_workload_showroom_deployer_chart_version: "2.2.*"

ocp4_workload_showroom_zero_touch_bundle: "https://github.com/rhpds/nookbag/releases/download/nookbag-v0.4.0/nookbag-v0.4.0.zip"

# Deploy a runtime automation runner sidecar container.
# Adds a /stream/ endpoint for SSE-based automation events.
ocp4_workload_showroom_runtime_automation_enable: false
# Override runtime automation image (empty = use chart default)
ocp4_workload_showroom_runtime_automation_image: ""
ocp4_workload_showroom_runtime_automation_environment_variables: {}
# Ansible credentials for runtime automation playbooks that target remote hosts.
# Optional; only needed when playbooks SSH to remote hosts.
ocp4_workload_showroom_runtime_automation_ansible_user: ""
ocp4_workload_showroom_runtime_automation_ansible_password: ""

# Enable passthrough of agnosticd_passthrough_user_data to individual users
ocp4_workload_showroom_passthrough_user_data: false
