---
# roles/ocp4_workload_showroom/tasks/setup_authguard_secrets.yaml
# Generates AUTH_TOKEN/SESSION_SECRET when the caller didn't supply their
# own, so `ocp4_workload_showroom_auth_enable: true` works out of the box.
#
# This file is included once PER USER from deploy_showroom.yaml when
# workload.yml loops over _showroom_user_data.users (multi-user mode). The
# guards below MUST key off the _showroom_auth_token_supplied /
# _showroom_auth_session_secret_supplied sentinels captured once, before
# that loop, in prepare_variables.yaml -- NOT off the live value of
# ocp4_workload_showroom_auth_token/_session_secret. set_fact persists for
# the rest of the play, so after user1's iteration generates a value, the
# live var is no longer empty; guarding on the live var would make every
# later user silently reuse user1's token/secret instead of getting their
# own.

- name: Generate an AUTH_TOKEN if the operator did not supply one
  when: not _showroom_auth_token_supplied
  ansible.builtin.set_fact:
    ocp4_workload_showroom_auth_token: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"

- name: Generate a SESSION_SECRET if the operator did not supply one
  when: not _showroom_auth_session_secret_supplied
  ansible.builtin.set_fact:
    ocp4_workload_showroom_auth_session_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"

- name: Publish the access token to user data
  agnosticd.core.agnosticd_user_info:
    data:
      showroom_access_token: "{{ ocp4_workload_showroom_auth_token }}"
    msg: "Showroom access token: {{ ocp4_workload_showroom_auth_token }}"
