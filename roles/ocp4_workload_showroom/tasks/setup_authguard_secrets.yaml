---
# roles/ocp4_workload_showroom/tasks/setup_authguard_secrets.yaml
# Generates AUTH_TOKEN/SESSION_SECRET when the caller didn't supply their
# own, so `ocp4_workload_showroom_auth_enable: true` works out of the box.

- name: Generate an AUTH_TOKEN if one was not supplied
  when: not ocp4_workload_showroom_auth_token
  ansible.builtin.set_fact:
    ocp4_workload_showroom_auth_token: "{{ lookup('ansible.builtin.password', '/dev/null length=24 chars=ascii_letters,digits') }}"

- name: Generate a SESSION_SECRET if one was not supplied
  when: not ocp4_workload_showroom_auth_session_secret
  ansible.builtin.set_fact:
    ocp4_workload_showroom_auth_session_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"

- name: Publish the access token to user data
  agnosticd.core.agnosticd_user_info:
    data:
      showroom_access_token: "{{ ocp4_workload_showroom_auth_token }}"
    msg: "Showroom access token: {{ ocp4_workload_showroom_auth_token }}"
